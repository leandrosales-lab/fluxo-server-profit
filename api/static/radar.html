<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo Server · Radar</title>
<script>/* tema antes da 1ª pintura (sem piscar) */ try { var t = localStorage.getItem("fluxo.tema"); } catch (e) {} document.documentElement.dataset.tema = (t === "claro" || t === "escuro") ? t : (matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "escuro");</script>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/radar.css">
</head>
<body>
<div class="tela">
  <header id="topo"></header>
  <section class="faixa">
    <div class="metrica"><span class="rotulo">Segurando agora</span><span class="valor" id="r-segurando">—</span></div>
    <div class="metrica"><span class="rotulo">Seguraram</span><span class="valor compra" id="r-seguraram">—</span></div>
    <div class="metrica"><span class="rotulo">Romperam</span><span class="valor venda" id="r-romperam">—</span></div>
    <div class="metrica"><span class="rotulo">Viraram sniper</span><span class="valor" id="r-sniper">—</span></div>
    <div class="metrica"><span class="rotulo">Papéis com negócio</span><span class="valor" id="r-papeis">—</span></div>
    <div class="metrica"><span class="rotulo">Negócios lidos</span><span class="valor" id="r-negocios">—</span></div>
  </section>
  <main class="corpo radar">
    <section class="secao">
      <div class="cab"><h2>Icebergs</h2><span id="janelas" title="Só os icebergs com giro dentro da janela (day trade)"><button class="seletor mono" data-janela="120">2 min</button><button class="seletor mono" data-janela="300">5 min</button><button class="seletor mono" data-janela="" aria-pressed="true">dia</button></span><span class="meta" id="radar-meta"></span>
        <span class="acoes" id="filtros"><button class="seletor" data-sit="" aria-pressed="true">todos</button><button class="seletor" data-sit="segurando">segurando</button><button class="seletor" data-sit="segurou">seguraram</button><button class="seletor" data-sit="rompeu">romperam</button><button class="seletor" data-sit="virou sniper">viraram sniper</button></span>
      </div>
      <table class="lista-radar"><colgroup><col><col><col><col><col><col><col><col><col><col></colgroup>
        <thead><tr><th>Papel</th><th>Corretora</th><th>Lado</th><th class="num">Preço</th><th class="num">Giros</th><th class="num">Volume</th><th>Desde</th><th title="Há quanto tempo foi o último giro (a corretora repôs o lote)">Último giro</th><th>Situação</th><th class="num">Acerto</th></tr></thead></table>
      <div class="rolagem"><table class="lista-radar"><colgroup><col><col><col><col><col><col><col><col><col><col></colgroup><tbody id="lista"></tbody></table></div>
      <p class="vazio-msg" id="radar-vazio" hidden></p>
    </section>
  </main>
  <footer id="rodape"></footer>
</div>
<script type="module" src="/static/js/radar.js"></script>
</body>
</html>
